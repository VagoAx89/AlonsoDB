<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact ASM Painting LLC for information and project estimates.">

    <title>Contact | ASM Painting LLC</title>

    <link rel="stylesheet" href="styles/main.css">

</head>


<body data-page="contact">

    <div id="site-header"></div>


    <main class="page">

        <section class="section reveal">

            <div class="container">

                <div class="section-header">

                    <div class="section-header__eyebrow">
                        Get in Touch
                    </div>

                    <h1 class="section-header__title">
                        Contact Us
                    </h1>

                    <p class="section-header__text">
                        Tell us a little about your project and we'll get back to you.
                    </p>

                </div>


                <div class="contact-grid">

                    <!-- Contact information -->

                    <div>

                        <h2>
                            Let's talk about your project.
                        </h2>

                        <p class="text-light">
                            Whether you're planning a small room refresh or a larger painting project, we'd be happy to
                            hear from you.
                        </p>


                        <div class="mt-6">

                            <h3>
                                Phone
                            </h3>

                            <p class="text-light">
                                <a href="tel:+15551234567">
                                    (512) 552-1888
                                </a>
                            </p>


                            <h3>
                                Email
                            </h3>

                            <p class="text-light">
                                <a href="mailto:estimating@asmpainting.com">
                                    estimating@asmpainting.com
                                </a>
                            </p>


                            <!-- <h3>
                                Service Area
                            </h3>

                            <p class="text-light">
                                Your City and surrounding areas
                            </p> -->

                        </div>

                    </div>


                    <!-- Contact form -->

                    <form id="contact-form" action="https://formspree.io/f/mzebeplg" method="POST">

                        <div class="form-group">
                            <label class="form-label" for="name">
                                Name
                            </label>

                            <input class="form-input" id="name" name="name" type="text" autocomplete="name" required>
                        </div>


                        <div class="form-group">
                            <label class="form-label" for="email">
                                Email
                            </label>

                            <input class="form-input" id="email" name="email" type="email" autocomplete="email"
                                required>
                        </div>


                        <div class="form-group">
                            <label class="form-label" for="phone">
                                Phone
                            </label>

                            <input class="form-input" id="phone" name="phone" type="tel" autocomplete="tel">
                        </div>


                        <div class="form-group">
                            <label class="form-label" for="message">
                                Tell us about your project
                            </label>

                            <textarea class="form-input" id="message" name="message" required></textarea>
                        </div>


                        <button id="sendBtn" type="submit" class="btn btn--primary">
                            Send Request
                        </button>


                        <p id="contact-status" class="text-muted mt-4" aria-live="polite"></p>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <div id="site-footer"></div>


    <script src="js/app.js" defer></script>

</body>

</html>
